name: SentiMetrics CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11" # Update this if you are using a different Python version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        # This will fail the pipeline if Ruff finds formatting or syntax errors
        ruff check .

    - name: Run Django Tests
      run: |
        # This will fail the pipeline if any tests fail
        python manage.py test