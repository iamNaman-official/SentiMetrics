name: SentiMetrics CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Django Test Suite
    runs-on: ubuntu-latest

    # Injecting environment variables for the test runner
    env:
      DJANGO_SECRET_KEY: "django-test-secret-key-github-actions"
      DEBUG: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          # This will fail the action if code formatting is incorrect
          ruff check .

      - name: Django System Check
        run: |
          # Ensures settings and models are configured correctly
          python manage.py check

      - name: Run Django Tests
        run: |
          # Tests the 'core' app logic (Updated from 'monitor')
          python manage.py test core