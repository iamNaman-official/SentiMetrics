<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% load static %}
    <title>{% block title %}SentiMetrics{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        base: '#0A0E14',
                        surface: '#11151C',
                        surfaceHover: '#161B24',
                        edge: '#1C212B',
                        brand: {
                            400: '#60A5FA', 500: '#3B82F6', 600: '#2563EB',
                        },
                        positive: '#10B981',
                        neutral: '#6B7280',
                        negative: '#EF4444',
                    },
                },
            },
        };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1C212B; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #262c39; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full min-h-screen bg-base text-slate-100 antialiased">


    <header class="border-b border-edge">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
            <a href="{% url 'dashboard' %}" class="flex items-center gap-2.5">
                <span class="flex h-6 w-6 items-center justify-center">
                    <svg class="h-6 w-6 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="9" />
                        <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none" />
                    </svg>
                </span>
                <span class="text-base font-semibold tracking-tight text-white">SentiMetrics</span>
            </a>
        </nav>
    </header>

    {% if messages %}
    <div class="mx-auto mt-6 max-w-6xl px-6">
        <div class="space-y-2">
            {% for message in messages %}
            <div class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm
                {% if message.tags == 'success' %}
                    border-positive/25 bg-positive/10 text-emerald-300
                {% elif message.tags == 'error' or message.tags == 'danger' %}
                    border-negative/25 bg-negative/10 text-red-300
                {% elif message.tags == 'warning' %}
                    border-amber-500/25 bg-amber-500/10 text-amber-300
                {% else %}
                    border-brand-500/25 bg-brand-500/10 text-brand-400
                {% endif %}">
                <svg class="mt-0.5 h-4 w-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                </svg>
                <p class="flex-1">{{ message }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <main class="mx-auto max-w-6xl px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
